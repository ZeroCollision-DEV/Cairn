; Cairn Injector configuration
; Lines starting with ';' are comments. Edit this file with any text editor.

[release]
; Official HTTPS URL of the Cairn client DLL, a GitHub release asset:
;   https://github.com/<owner>/<repo>/releases/download/<tag>/cairn.dll
url=https://github.com/ZeroCollision-DEV/Cairn/releases/download/v0.1.1/cairn.dll
; Trusted SHA-256 of that exact DLL (64 hex characters). REQUIRED: the injector will
; not load a DLL unless its hash matches. Update it for every new release.
sha256=D5466B9D5FCCCA799188BEA35EC3E71154589006A61FEB6BFEF424B2B2CF5D80
; File name used inside the cache folder (must end in .dll).
filename=cairn.dll
; Require a github.com release URL. Set to false only to use another HTTPS host.
strict_github_url=true

[target]
; Process to look for, and text its window title must contain.
process=javaw.exe
window_title_contains=Minecraft

[developer]
; NOT part of the normal workflow. Path to a locally built DLL (for example
; bin\cairn.dll, relative to the Cairn folder) to load instead of downloading.
; Leave empty for normal use. A sha256 set above is still enforced.
local_dll=
